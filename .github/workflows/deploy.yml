name: EstateFlow CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Validate Backend
        working-directory: ./server
        run: |
          npm install
          # npm test # Uncomment once tests are added
          
      - name: Validate Frontend
        working-directory: ./client
        run: |
          npm install
          npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

  # Note: The actual deployment is triggered automatically by Vercel/Koyeb 
  # when this workflow successfully completes and the code is on 'main'.
